<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dice Roll</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Dice Roll</h1>

    <div class="dice">
      <img id="dice1" src="images/dice1.svg" alt="Dice">
      <img id="dice2" src="images/dice1.svg" alt="Dice">
    </div>

    <p id="result">Roll the dice!</p>

    <button id="btn1">Roll 1 Die</button>
    <button id="btn2">Roll 2 Dice</button>

    <h2>History</h2>
    <ul id="history"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
